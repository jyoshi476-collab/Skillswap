<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSwap — Learn together</title>
<style>
:root{--ink:#17233c;--muted:#68758d;--line:#e7ebf3;--bg:#f6f8fc;--purple:#6658e8;--blue:#3e8bdf;--mint:#dff8ee;--white:#fff;--shadow:0 12px 35px rgba(35,48,85,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,20px);position:sticky;top:0;z-index:5}.brand{font-size:23px;font-weight:850;letter-spacing:-1px;color:var(--ink)}.brand span{color:var(--purple)}.nav{display:flex;gap:8px;align-items:center}.nav button,.linkbtn{background:transparent;color:#68758d;padding:10px 13px;border-radius:12px;font-weight:650}.nav button.active,.nav button:hover{background:#f0efff;color:var(--purple)}.avatar{width:38px;height:38px;border-radius:50%;background:#e9e7ff;color:var(--purple);display:grid;place-items:center;font-weight:800}.container{max-width:1160px;margin:auto;padding:30px 22px 70px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:35px;align-items:center;padding:48px 0 55px}.eyebrow{color:var(--purple);font-weight:800;letter-spacing:.09em;text-transform:uppercase;font-size:12px}.hero h1{font-size:clamp(38px,5vw,62px);line-height:1.05;letter-spacing:-2.8px;margin:14px 0}.hero h1 em{font-style:normal;color:var(--purple)}.hero p{font-size:17px;color:var(--muted);max-width:590px}.actions{display:flex;gap:12px;margin-top:25px;flex-wrap:wrap}.btn{padding:12px 19px;border-radius:12px;font-weight:750;background:var(--purple);color:white;box-shadow:0 7px 18px #6658e833}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.small{padding:8px 12px;font-size:13px}.hero-art{background:linear-gradient(135deg,#eeedff,#e6f8f5);border-radius:28px;padding:26px;min-height:300px;display:grid;place-items:center;position:relative;overflow:hidden}.swap-visual{display:grid;grid-template-columns:1fr 1fr;gap:15px;width:100%;max-width:390px}.person{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow)}.face{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:23px;background:#eeeaff}.person h3{margin:9px 0 2px}.person small{color:var(--muted)}.tag{display:inline-block;background:#f0efff;color:#5b50ca;padding:5px 9px;border-radius:30px;font-size:11px;font-weight:750;margin:5px 3px 0 0}.tag.green{background:#e6f8ef;color:#21855d}.swapmark{position:absolute;left:calc(50% - 20px);top:46%;background:var(--purple);color:white;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:4px solid #f0efff;font-weight:900}.section-title{display:flex;justify-content:space-between;align-items:end;margin:25px 0 18px}.section-title h2{margin:0;font-size:25px;letter-spacing:-.8px}.section-title p{margin:3px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 3px 15px #23305508}.stepnum{width:34px;height:34px;border-radius:11px;background:#efeeff;color:var(--purple);display:grid;place-items:center;font-weight:850}.card h3{margin:12px 0 5px}.muted{color:var(--muted)}.categories{display:flex;flex-wrap:wrap;gap:10px}.category{background:#fff;border:1px solid var(--line);padding:11px 15px;border-radius:13px;font-weight:650;color:#49566e}.category:hover{border-color:var(--purple);color:var(--purple)}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:8px 0 23px}.pagehead h1{font-size:30px;margin:0;letter-spacing:-1px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.stat b{font-size:27px;display:block}.stat span{color:var(--muted);font-size:13px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.field{width:100%;padding:12px 13px;border:1px solid #dfe4ee;border-radius:11px;background:white;color:var(--ink);outline:none}.field:focus{border-color:var(--purple);box-shadow:0 0 0 3px #6658e81a}.filters .field{max-width:240px}.student-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.student-top{display:flex;gap:12px;align-items:center}.photo{width:52px;height:52px;border-radius:17px;background:#eeedff;display:grid;place-items:center;font-size:24px}.student-top h3{margin:0}.score{margin-left:auto;background:#e5f8ef;color:#21855d;padding:6px 9px;border-radius:10px;font-weight:800;font-size:12px}.chips{margin:13px 0}.chips strong{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.rowbtn{display:flex;gap:8px;margin-top:14px}.rowbtn button{flex:1}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formcard{max-width:650px;margin:25px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:var(--shadow)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formgroup label{font-size:13px;font-weight:750;display:block;margin-bottom:6px}.formgroup.full{grid-column:1/-1}.progress{height:8px;background:#eceef5;border-radius:20px;overflow:hidden;margin:15px 0}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),#55b7ce);width:25%}.profilehero{display:flex;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);padding:22px;border-radius:18px;margin-bottom:16px}.bigphoto{width:76px;height:76px;border-radius:24px;background:#eeedff;display:grid;place-items:center;font-size:32px}.request{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding:15px 0}.request:last-child{border:0}.status{font-size:12px;font-weight:800;padding:5px 9px;border-radius:20px;background:#fff2d9;color:#9b6a11}.status.Accepted{background:#e5f8ef;color:#21855d}.status.Rejected{background:#ffe9e9;color:#b64c4c}.chatlayout{display:grid;grid-template-columns:280px 1fr;gap:15px;min-height:480px}.chatlist,.chatbox{background:white;border:1px solid var(--line);border-radius:17px;padding:16px}.chatperson{padding:12px;border-radius:12px;cursor:pointer}.chatperson.active,.chatperson:hover{background:#f1f0ff}.chatmessages{height:340px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:10px 0}.bubble{max-width:75%;padding:10px 13px;border-radius:15px;background:#f0f1f7;align-self:flex-start}.bubble.mine{background:#6658e8;color:white;align-self:flex-end}.sendrow{display:flex;gap:8px}.sendrow input{flex:1}.empty{padding:35px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d9deea;border-radius:17px}.notice{background:#f0efff;color:#5147b7;padding:12px 14px;border-radius:12px;font-size:13px;margin:12px 0}.hidden{display:none!important}.mobilemenu{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17233c;color:#fff;padding:11px 18px;border-radius:12px;z-index:20;box-shadow:var(--shadow)}footer{padding:25px;text-align:center;color:var(--muted)}
@media(max-width:850px){.nav{display:none;position:absolute;top:71px;left:0;right:0;background:#fff;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.nav.open{display:flex}.mobilemenu{display:block;background:#f1f0ff;color:var(--purple);padding:9px 12px;border-radius:10px}.hero{grid-template-columns:1fr;padding-top:25px}.hero-art{min-height:250px}.grid,.student-grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.container{padding:22px 15px 55px}.top{padding:0 15px}.brand{font-size:21px}.grid,.student-grid,.two{grid-template-columns:1fr}.hero h1{font-size:42px}.hero-art{padding:15px}.person{padding:13px}.stats{gap:9px}.stat{padding:13px}.stat b{font-size:23px}.pagehead{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.formgroup.full{grid-column:auto}.chatlayout{grid-template-columns:1fr}.chatlist{max-height:160px;overflow:auto}.profilehero{align-items:flex-start}.request{align-items:flex-start;flex-direction:column}.filters .field{max-width:none;flex:1 1 100%}}
</style>
</head>
<body><div class="shell">
<header class="top"><div class="brand">Skill<span>Swap</span> ✦</div><nav class="nav" id="nav">
<button data-page="home" class="active">Home</button><button data-page="discover">Discover Skills</button><button data-page="matches">My Matches</button><button data-page="requests">Requests</button><button data-page="messages">Messages</button><button data-page="profile">Profile</button>
</nav><div style="display:flex;gap:10px;align-items:center"><button class="mobilemenu" onclick="document.getElementById('nav').classList.toggle('open')">☰ Menu</button><button class="btn small" id="authBtn" onclick="openAuth()">Sign in</button><div class="avatar" id="topAvatar">✦</div></div></header>
<main class="container" id="app"></main><footer>SkillSwap · Learn a Skill. Teach a Skill. Grow Together.</footer></div><div id="toast" class="toast hidden"></div>
<script>
const categories=['Programming','Web Development','Graphic Design','Video Editing','Photography','Public Speaking','English Communication','Mathematics','Music','Drawing','AI and Machine Learning'];
const demo=[
{id:'rahul',name:'Rahul Sharma',email:'rahul@demo.com',college:'RGUKT Srikakulam',branch:'CSE',year:'2nd Year',bio:'I enjoy solving problems with code and making things that help people.',photo:'👨🏻‍💻',teach:['Python','C Programming'],learn:['Video Editing','Graphic Design']},
{id:'priya',name:'Priya Reddy',email:'priya@demo.com',college:'RGUKT Srikakulam',branch:'ECE',year:'2nd Year',bio:'Creative video editor who loves sharing ideas and learning technology.',photo:'👩🏻‍🎨',teach:['Video Editing','Graphic Design'],learn:['Python']},
{id:'arjun',name:'Arjun Kumar',email:'arjun@demo.com',college:'Andhra University',branch:'CSE',year:'3rd Year',bio:'Building websites and exploring new technologies.',photo:'🧑🏻‍💻',teach:['Web Development'],learn:['Public Speaking']},
{id:'ananya',name:'Ananya Das',email:'ananya@demo.com',college:'Andhra University',branch:'IT',year:'2nd Year',bio:'I love communication, presentations and helping others speak confidently.',photo:'👩🏻‍🏫',teach:['Public Speaking','English Communication'],learn:['Web Development']},
{id:'kiran',name:'Kiran Rao',email:'kiran@demo.com',college:'RGUKT Srikakulam',branch:'CSE',year:'1st Year',bio:'Maths enthusiast learning to create useful apps.',photo:'🧑🏻‍🎓',teach:['Mathematics','C Programming'],learn:['Python','AI and Machine Learning']},
{id:'meera',name:'Meera Nair',email:'meera@demo.com',college:'JNTU Kakinada',branch:'CSE',year:'2nd Year',bio:'Photographer and sketch artist. Happy to swap creative skills.',photo:'📸',teach:['Photography','Drawing'],learn:['English Communication']}
];
let db=JSON.parse(localStorage.getItem('skillswap_db')||'null')||{users:demo,requests:[],messages:[],notifications:[]};
let current=localStorage.getItem('skillswap_user')||null,page='home',chatWith=null;
function save(){localStorage.setItem('skillswap_db',JSON.stringify(db));localStorage.setItem('skillswap_user',current||'')}
function me(){return db.users.find(u=>u.id===current)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2300)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('nav').classList.remove('open');render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function score(a,b){let ab=a.teach.filter(s=>b.learn.includes(s)).length,ba=b.teach.filter(s=>a.learn.includes(s)).length;let total=new Set([...a.learn,...b.learn]).size;return {ab,ba,perfect:ab>0&&ba>0,pct:Math.min(99,Math.round((ab+ba)/Math.max(1,total)*100))}}
function matches(){if(!me())return[];return db.users.filter(u=>u.id!==current).map(u=>({...u,match:score(me(),u)})).filter(u=>u.match.ab||u.match.ba).sort((a,b)=>b.match.pct-a.match.pct)}
function card(u){return `<article class="card"><div class="student-top"><div class="photo">${u.photo||'🎓'}</div><div><h3>${esc(u.name)}</h3><div class="muted" style="font-size:12px">${esc(u.college)} · ${esc(u.branch)}</div></div>${u.match?`<span class="score">${u.match.pct}% match</span>`:''}</div><div class="chips"><strong>CAN TEACH</strong>${(u.teach||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')||'—'}</div><div class="chips"><strong>WANTS TO LEARN</strong>${(u.learn||[]).map(s=>`<span class="tag green">${esc(s)}</span>`).join('')||'—'}</div><div class="rowbtn"><button class="btn secondary small" onclick="viewStudent('${u.id}')">View Profile</button><button class="btn small" onclick="requestSwap('${u.id}')">Request Swap</button></div></article>`}
function render(){document.getElementById('authBtn').textContent=current?'Sign out':'Sign in';document.getElementById('authBtn').onclick=current?logout:openAuth;document.getElementById('topAvatar').textContent=me()?.photo||'✦';let app=document.getElementById('app');
if(page==='home')app.innerHTML=home();
if(page==='discover')app.innerHTML=discover();
if(page==='matches')app.innerHTML=matchesPage();
if(page==='requests')app.innerHTML=requestsPage();
if(page==='messages')app.innerHTML=messagesPage();
if(page==='profile')app.innerHTML=profilePage();
if(page==='dashboard')app.innerHTML=dashboard();
if(page==='student')app.innerHTML=studentPage(window.viewId);
}
function home(){return `<section class="hero"><div><div class="eyebrow">A better way to learn together</div><h1>Trade skills.<br><em>Grow together.</em></h1><p>SkillSwap connects students who want to teach what they know with peers who want to learn it. No fees, no pressure — just shared knowledge and new connections.</p><div class="actions"><button class="btn" onclick="current?go('dashboard'):openAuth(true)">Get Started →</button><button class="btn secondary" onclick="go('discover')">Find Skills</button></div><p style="font-size:13px;margin-top:18px">✦ Built for curious college minds</p></div><div class="hero-art"><div class="swap-visual"><div class="person"><div class="face">👨🏻‍💻</div><h3>Rahul</h3><small>Can teach</small><div><span class="tag">Python</span></div><small>Wants to learn</small><div><span class="tag green">Video Editing</span></div></div><div class="person"><div class="face">👩🏻‍🎨</div><h3>Priya</h3><small>Can teach</small><div><span class="tag">Video Editing</span></div><small>Wants to learn</small><div><span class="tag green">Python</span></div></div></div><div class="swapmark">⇄</div></div></section>
<div class="section-title"><div><h2>How SkillSwap works</h2><p>Five simple steps to start exchanging knowledge.</p></div></div><div class="grid">${[['01','Create your profile','Tell the community a little about yourself.'],['02','Add skills you can teach','Share the skills you are confident in.'],['03','Choose what to learn','Tell us what you want to explore next.'],['04','Find your skill match','Discover students with complementary skills.'],['05','Connect and swap','Send a request and start learning together.']].map(x=>`<div class="card"><div class="stepnum">${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]}</p></div>`).join('')}</div>
<div class="section-title" style="margin-top:42px"><div><h2>Explore popular skills</h2><p>There is always something new to learn.</p></div><button class="linkbtn" onclick="go('discover')">Explore all →</button></div><div class="categories">${categories.map(c=>`<button class="category" onclick="go('discover');setTimeout(()=>{document.getElementById('skillFilter').value='${c}';filterStudents()},30)">${c}</button>`).join('')}</div><div class="notice">✨ Try the demo profiles in Discover to see how matching works. Create an account to build your own profile.</div>`}
function discover(){return `<div class="pagehead"><div><h1>Discover students</h1><p class="muted">Find someone to learn with — and share what you know.</p></div></div><div class="filters"><input class="field" id="search" placeholder="Search name, college or skill..." oninput="filterStudents()"><select class="field" id="skillFilter" onchange="filterStudents()"><option value="">All skills</option>${categories.map(c=>`<option>${c}</option>`).join('')}<option>Python</option><option>C Programming</option></select><select class="field" id="typeFilter" onchange="filterStudents()"><option value="all">Teach or learn</option><option value="teach">Can teach</option><option value="learn">Wants to learn</option></select><select class="field" id="collegeFilter" onchange="filterStudents()"><option value="">All colleges</option>${[...new Set(db.users.map(u=>u.college))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="student-grid" id="studentGrid">${db.users.filter(u=>u.id!==current).map(u=>card({...u,match:me()?score(me(),u):null})).join('')}</div>`}
function filterStudents(){let q=(document.getElementById('search')?.value||'').toLowerCase(),s=document.getElementById('skillFilter')?.value||'',t=document.getElementById('typeFilter')?.value||'all',c=document.getElementById('collegeFilter')?.value||'';let list=db.users.filter(u=>u.id!==current).filter(u=>(!q||[u.name,u.college,...u.teach,...u.learn].join(' ').toLowerCase().includes(q))&&(!s||(t==='teach'?u.teach:t==='learn'?u.learn:[...u.teach,...u.learn]).includes(s))&&(!c||u.college===c));document.getElementById('studentGrid').innerHTML=list.length?list.map(u=>card({...u,match:me()?score(me(),u):null})).join(''):'<div class="empty">No students found. Try another skill or filter.</div>'}
function matchesPage(){if(!me())return loginPrompt();let list=matches();return `<div class="pagehead"><div><h1>My skill matches</h1><p class="muted">Students whose skills complement yours.</p></div></div><div class="notice">A <b>Perfect Match</b> means you can teach each other something. Learning matches are one-way opportunities.</div>${list.length?`<div class="student-grid">${list.map(u=>`<div>${u.match.perfect?'<div style="margin:0 0 7px"><span class="tag green">✦ PERFECT SKILL MATCH</span></div>':''}${card(u)}</div>`).join('')}</div>`:'<div class="empty">Add skills to your profile to discover matches.</div>'}`}
function requestsPage(){if(!me())return loginPrompt();let sent=db.requests.filter(r=>r.from===current),received=db.requests.filter(r=>r.to===current);return `<div class="pagehead"><div><h1>Skill swap requests</h1><p class="muted">Keep track of invitations and accepted swaps.</p></div></div><div class="two"><section class="card"><h3>Requests received</h3>${received.length?received.map(r=>requestRow(r,true)).join(''):'<p class="muted">No incoming requests yet.</p>'}</section><section class="card"><h3>Requests sent</h3>${sent.length?sent.map(r=>requestRow(r,false)).join(''):'<p class="muted">You have not sent any requests.</p>'}</section></div><section class="card" style="margin-top:16px"><h3>Accepted connections</h3>${db.requests.filter(r=>(r.from===current||r.to===current)&&r.status==='Accepted').map(r=>{let other=db.users.find(u=>u.id===(r.from===current?r.to:r.from));return `<div class="request"><div><b>${esc(other?.name||'Student')}</b><div class="muted">Swap: ${esc(r.offer)} ↔ ${esc(r.want)}</div></div><button class="btn small" onclick="openChat('${other?.id}')">Message</button></div>`}).join('')||'<p class="muted">Accepted swaps will appear here.</p>'}</section>`}
function requestRow(r,incoming){let other=db.users.find(u=>u.id===(incoming?r.from:r.to));return `<div class="request"><div><b>${esc(other?.name||'Student')}</b><div class="muted" style="font-size:13px">${esc(r.message)}</div><span class="status ${r.status}">${r.status}</span></div>${incoming&&r.status==='Pending'?`<div style="display:flex;gap:6px"><button class="btn small" onclick="respond('${r.id}','Accepted')">Accept</button><button class="btn secondary small" onclick="respond('${r.id}','Rejected')">Reject</button></div>`:''}</div>`}
function messagesPage(){if(!me())return loginPrompt();let accepted=db.requests.filter(r=>(r.from===current||r.to===current)&&r.status==='Accepted'),partners=[...new Set(accepted.map(r=>r.from===current?r.to:r.from))];if(!chatWith||!partners.includes(chatWith))chatWith=partners[0]||null;return `<div class="pagehead"><div><h1>Messages</h1><p class="muted">Chat with students after a swap is accepted.</p></div></div>${!partners.length?'<div class="empty">Your chats will appear after a student accepts your Skill Swap request.</div>':`<div class="chatlayout"><div class="chatlist"><b>Connections</b>${partners.map(id=>{let u=db.users.find(x=>x.id===id);return `<div class="chatperson ${chatWith===id?'active':''}" onclick="openChat('${id}')">${u?.photo||'🎓'} ${esc(u?.name||'Student')}</div>`}).join('')}</div><div class="chatbox"><b>${esc(db.users.find(u=>u.id===chatWith)?.name||'Chat')}</b><div class="notice">Share contact details only if both of you are comfortable. Keep personal information private.</div><div class="chatmessages" id="chatMessages">${db.messages.filter(m=>m.pair===pair(current,chatWith)).map(m=>`<div class="bubble ${m.from===current?'mine':''}">${esc(m.text)}<div style="font-size:10px;opacity:.7;margin-top:3px">${new Date(m.time).toLocaleString()}</div></div>`).join('')}</div><div class="sendrow"><input class="field" id="chatInput" placeholder="Write a message..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn" onclick="sendMessage()">Send</button></div></div></div>`}`}
function pair(a,b){return [a,b].sort().join('::')}
function profilePage(){if(!me())return loginPrompt();let u=me();return `<div class="pagehead"><div><h1>My profile</h1><p class="muted">Make it easy for others to find their learning partner.</p></div><button class="btn" onclick="editProfile()">Edit profile</button></div><div class="profilehero"><div class="bigphoto">${u.photo||'🎓'}</div><div><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">${esc(u.college)} · ${esc(u.branch)} · ${esc(u.year)}</div><p style="margin-bottom:0">${esc(u.bio||'Add a short bio to introduce yourself.')}</p></div></div><div class="two"><div class="card"><h3>✨ Skills I can teach</h3>${(u.teach||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')||'<p class="muted">No skills added yet.</p>'}</div><div class="card"><h3>🌱 Skills I want to learn</h3>${(u.learn||[]).map(s=>`<span class="tag green">${esc(s)}</span>`).join('')||'<p class="muted">No skills added yet.</p>'}</div></div><div class="card" style="margin-top:16px"><h3>Profile setup progress</h3><div class="progress"><div style="width:${[u.bio,u.teach?.length,u.learn?.length].filter(Boolean).length/3*100}%"></div></div><p class="muted">Complete your bio and add both teaching and learning skills to improve your matches.</p></div>`}
function dashboard(){if(!me())return loginPrompt();let u=me(),list=matches(),pending=db.requests.filter(r=>r.to===current&&r.status==='Pending').length,accepted=db.requests.filter(r=>(r.to===current||r.from===current)&&r.status==='Accepted').length;return `<div class="pagehead"><div><h1>Welcome back, ${esc(u.name.split(' ')[0])} 👋</h1><p class="muted">Your next skill exchange is just a connection away.</p></div><button class="btn" onclick="go('discover')">Find students</button></div><div class="stats"><div class="stat"><b>${u.teach.length}</b><span>Skills you can teach</span></div><div class="stat"><b>${u.learn.length}</b><span>Skills to learn</span></div><div class="stat"><b>${list.length}</b><span>Skill matches</span></div><div class="stat"><b>${pending}</b><span>Pending requests</span></div></div><div class="section-title"><div><h2>Recommended matches</h2><p>Based on your teaching and learning skills.</p></div><button class="linkbtn" onclick="go('matches')">See all →</button></div>${list.length?`<div class="student-grid">${list.slice(0,3).map(card).join('')}</div>`:'<div class="empty">Add skills to your profile to get personalized matches.</div>'}<div class="notice">You have <b>${accepted}</b> accepted connection(s). Open Messages to continue learning together.</div>`}
function studentPage(id){let u=db.users.find(x=>x.id===id);if(!u)return '<div class="empty">Student not found.</div>';let m=me()?score(me(),u):{ab:0,ba:0,perfect:false,pct:0};return `<button class="linkbtn" onclick="go('discover')">← Back to Discover</button><div class="profilehero" style="margin-top:15px"><div class="bigphoto">${u.photo||'🎓'}</div><div><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">${esc(u.college)} · ${esc(u.branch)} · ${esc(u.year)}</div><p>${esc(u.bio)}</p></div></div><div class="two"><div class="card"><h3>Can teach</h3>${u.teach.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><div class="card"><h3>Wants to learn</h3>${u.learn.map(s=>`<span class="tag green">${esc(s)}</span>`).join('')}</div></div><div class="card" style="margin-top:16px"><h3>Skills you both can exchange</h3>${m.ab||m.ba?`<p>You can teach them: <b>${me().teach.filter(s=>u.learn.includes(s)).join(', ')||'—'}</b></p><p>They can teach you: <b>${u.teach.filter(s=>me().learn.includes(s)).join(', ')||'—'}</b></p><span class="score">${m.pct}% match</span>${m.perfect?'<span class="tag green">Perfect Skill Match</span>':''}`:'<p class="muted">No direct skill exchange found yet.</p>'}<div class="actions"><button class="btn" onclick="requestSwap('${u.id}')">Request Skill Swap</button></div></div>`}
function loginPrompt(){return `<div class="empty"><h3>Sign in to continue</h3><p>Create a student profile to save matches and exchange skills.</p><button class="btn" onclick="openAuth()">Sign in / Sign up</button></div>`}
function viewStudent(id){window.viewId=id;go('student')}
function openChat(id){chatWith=id;go('messages')}
function requestSwap(id){if(!me()){openAuth();return}let u=db.users.find(x=>x.id===id),m=score(me(),u);let offer=me().teach.find(s=>u.learn.includes(s))||me().teach[0],want=u.teach.find(s=>me().learn.includes(s))||u.teach[0];if(!offer||!want){toast('Add teaching and learning skills to request a swap.');return}if(db.requests.some(r=>r.from===current&&r.to===id&&r.status!=='Rejected')){toast('You already have an active request with this student.');return}let msg=`Hi ${u.name}! I can teach you ${offer}, and I would like to learn ${want} from you. Would you like to do a Skill Swap?`;db.requests.push({id:'r'+Date.now(),from:current,to:id,offer,want,message:msg,status:'Pending'});db.notifications.push({to:id,text:`New Skill Swap request from ${me().name}`});save();toast('Skill Swap request sent!');go('requests')}
function respond(id,status){let r=db.requests.find(x=>x.id===id);r.status=status;db.notifications.push({to:r.from,text:`Your Skill Swap request was ${status.toLowerCase()}.`});save();toast('Request '+status.toLowerCase());render()}
function sendMessage(){let input=document.getElementById('chatInput'),textv=input.value.trim();if(!textv)return;db.messages.push({pair:pair(current,chatWith),from:current,to:chatWith,text:textv,time:Date.now()});save();render()}
function editProfile(){let u=me();document.getElementById('app').innerHTML=`<div class="formcard"><h2>Edit your profile</h2><form onsubmit="saveProfile(event)"><div class="formgrid"><div class="formgroup"><label>Full name</label><input class="field" name="name" required value="${esc(u.name)}"></div><div class="formgroup"><label>Profile emoji</label><input class="field" name="photo" value="${esc(u.photo||'🎓')}"></div><div class="formgroup"><label>College</label><input class="field" name="college" required value="${esc(u.college)}"></div><div class="formgroup"><label>Branch / Department</label><input class="field" name="branch" value="${esc(u.branch)}"></div><div class="formgroup"><label>Year of study</label><select class="field" name="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div><div class="formgroup full"><label>About me</label><textarea class="field" name="bio" rows="3">${esc(u.bio)}</textarea></div><div class="formgroup full"><label>Skills I can teach (comma separated)</label><input class="field" name="teach" value="${esc(u.teach.join(', '))}"></div><div class="formgroup full"><label>Skills I want to learn (comma separated)</label><input class="field" name="learn" value="${esc(u.learn.join(', '))}"></div></div><div class="actions"><button class="btn">Save profile</button><button type="button" class="btn secondary" onclick="go('profile')">Cancel</button></div></form></div>`}
function saveProfile(e){e.preventDefault();let f=new FormData(e.target),u=me();['name','college','branch','year','bio','photo'].forEach(k=>u[k]=f.get(k));u.teach=f.get('teach').split(',').map(s=>s.trim()).filter(Boolean);u.learn=f.get('learn').split(',').map(s=>s.trim()).filter(Boolean);save();toast('Profile updated');go('profile')}
function openAuth(signup=false){document.getElementById('app').innerHTML=`<div class="formcard"><div class="eyebrow">Join the skill-sharing community</div><h2 id="authTitle">${signup?'Create your account':'Welcome to SkillSwap'}</h2><div class="notice">Demo accounts: rahul@demo.com, priya@demo.com, arjun@demo.com or ananya@demo.com — password: demo123</div><div class="actions" style="margin:10px 0 18px"><button class="btn small" onclick="openAuth(false)">Login</button><button class="btn secondary small" onclick="openAuth(true)">Sign up</button></div><form onsubmit="authSubmit(event,${signup})"><div class="formgrid">${signup?`<div class="formgroup full"><label>Full name</label><input class="field" name="name" required placeholder="Your full name"></div><div class="formgroup full"><label>College name</label><input class="field" name="college" required placeholder="Your college"></div><div class="formgroup"><label>Branch / Department</label><input class="field" name="branch" required placeholder="e.g. CSE"></div><div class="formgroup"><label>Year of study</label><select class="field" name="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div>`:''}<div class="formgroup full"><label>Email</label><input class="field" type="email" name="email" required placeholder="student@example.com"></div><div class="formgroup full"><label>Password</label><input class="field" type="password" name="password" required minlength="6" placeholder="At least 6 characters"></div></div><button class="btn" style="width:100%;margin-top:18px">${signup?'Create account':'Login'}</button></form></div>`}
function authSubmit(e,signup){e.preventDefault();let f=new FormData(e.target),email=f.get('email').toLowerCase(),pass=f.get('password');if(signup){if(db.users.some(u=>u.email.toLowerCase()===email)){toast('Email already registered');return}let u={id:'u'+Date.now(),name:f.get('name'),email,password:pass,college:f.get('college'),branch:f.get('branch'),year:f.get('year'),bio:'',photo:'🎓',teach:[],learn:[]};db.users.push(u);current=u.id;save();toast('Account created! Complete your profile.');go('profile')}else{let u=db.users.find(x=>x.email.toLowerCase()===email&&(x.password===pass||(x.id.length<20&&pass==='demo123')));if(!u){toast('Invalid email or password');return}current=u.id;save();toast('Welcome back!');go('dashboard')}}
function logout(){current=null;save();toast('Signed out');go('home')}
if(current&&!me()){current=null;save()}render();
</script></body></html>
